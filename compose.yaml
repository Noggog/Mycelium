name: mycelium

# Mycelium stack: one app container (API + SPA on a single HTTP port) plus MongoDB. The Aspire
# AppHost is NOT used here — it's a local-dev orchestrator only. Put this service behind your own
# reverse proxy / TLS; it just speaks plain HTTP on ${HTTP_PORT}.
# Copy .env.example to .env and fill it in (Komodo can also inject these values).

services:
  app:
    build: .
    image: mycelium:latest
    # Built locally from the Dockerfile — never pull it from a registry (it isn't published).
    # Without this, `docker compose pull` (which Komodo runs before deploy) fails with
    # "pull access denied" because mycelium:latest exists in no registry.
    pull_policy: build
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-43105}:8080"
    environment:
      # --- Auth / OIDC (Authentik). PUBLIC_ORIGIN is the public URL your reverse proxy serves
      #     this app at; the OIDC redirect URI registered in Authentik is that origin + /signin-oidc.
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      OIDC_AUTHORITY: ${OIDC_AUTHORITY}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      # --- Plex ---
      PLEX_ENDPOINT: ${PLEX_ENDPOINT}
      PLEX_TOKEN: ${PLEX_TOKEN}
      PLEX_LIBRARY: ${PLEX_LIBRARY:-}
      # --- Data store ---
      MONGO_URI: mongodb://mongo:27017
      # --- Deezer downloads (streamrip). The ARL lives in streamrip's own config volume. ---
      # Automatic vs. manual draining isn't set here: it's the Download page's switch, stored in Mongo.
      MUSIC_DOWNLOAD_DIR: /music
      DEEZER_QUALITY: ${DEEZER_QUALITY:-2}
      DEEZER_FALLBACK_QUALITY: ${DEEZER_FALLBACK_QUALITY:-1}
      # The daily catalog/album syncs run at DAILY_SYNC_HOUR in *this container's* local time, so set
      # TZ if you want "6am" to mean 6am where the server is (the image is UTC otherwise).
      TZ: ${TZ:-UTC}
      # Optional knobs (left unset -> backend defaults): TIMER_JITTER_PERCENT, RELATED_STALENESS_DAYS,
      # DAILY_SYNC_HOUR, QUEUE_REPLENISH_INTERVAL_HOURS, DEEZER_CODEC, DOWNLOAD_BATCH_SIZE,
      # DOWNLOAD_ITEM_DELAY_SECONDS, DOWNLOAD_BATCH_INTERVAL_MINUTES,
      # DEEZER_DOWNLOAD_TIMEOUT_MINUTES, DOWNLOAD_SETTLE_INTERVAL_MINUTES,
      # DOWNLOAD_SETTLE_WINDOW_HOURS, PLEX_RESCAN_AFTER_DOWNLOAD, PLEX_RESCAN_DEBOUNCE_MINUTES,
      # RECONSIDER_MIN_AVG_STARS, RECONSIDER_MAX_AVG_STARS, RECONSIDER_MIN_RATED_FRACTION,
      # RECONSIDER_SWEEP_INTERVAL_DAYS, PLEX_APP_PRODUCT, PLEX_CLIENT_IDENTIFIER.
    volumes:
      # Downloads must land where Plex scans — point this host path at your Plex music library.
      - ${MUSIC_DOWNLOAD_DIR_HOST}:/music
      # streamrip config (Deezer ARL + folder_format) — bind-mounted so you can edit config.toml.
      - ${STREAMRIP_CONFIG_HOST}:/config
      - app_logs:/app/logs
    # Start order only — deliberately NOT `condition: service_healthy`. Under Podman the healthcheck
    # is driven by a transient systemd timer, and when that doesn't fire the compose wait sat on
    # "starting" for ~5 minutes per deploy even though mongod was up in under a second. Mongo still
    # starts first, and the Mongo driver's server-selection window (30s) covers the rest, so the app
    # tolerates connecting a moment early.
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    # Status only — nothing sequences off this (see the depends_on note above). A TCP probe rather
    # than `mongosh --eval "db.adminCommand('ping')"`: mongosh boots a whole Node runtime per probe,
    # which at any useful interval is constant CPU to answer a question nobody asks. mongod doesn't
    # bind 27017 until it's accepting connections, so this is still a sound readiness signal; it
    # just won't catch a wedged-but-listening mongod, which the ping wasn't being used for anyway.
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/127.0.0.1/27017'"]
      interval: 30s
      start_period: 30s
      timeout: 3s
      retries: 5

volumes:
  mongo_data:
  app_logs:
